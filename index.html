<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Changes</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#102d8d;
  --bg-2:#2443b1;
  --block:#123392;
  --panel:#f3efe7;
  --panel-2:#e8e0d2;
  --text:#f8f8f9;
  --muted:#cfe2ff;
  --hi:#ffd447;
  --hi-2:#ffbf1f;
  --on-hi:#0c1736;
  --line:rgba(255,255,255,.18);
  --shadow:0 22px 44px rgba(9,20,52,.28);
  --card-shadow:0 10px 24px rgba(12,23,54,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1633;--bg-2:#122f7a;--block:#17275a;--text:#f3f6ff;--muted:#d5dfef}}
:root[data-theme="dark"]{--bg:#0b1633;--bg-2:#122f7a;--block:#17275a;--text:#f3f6ff;--muted:#d5dfef}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top, rgba(255,212,71,.2), transparent 34%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
  color:var(--text);
  font:400 16px/1.4 "Libre Franklin","Franklin Gothic Medium","Arial Narrow",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
main{
  max-width:560px;
  margin:0 auto;
  padding:32px 18px 56px;
}
header{margin-bottom:20px}
h1{
  font-weight:900;
  font-size:clamp(54px,18vw,96px);
  line-height:.84;
  letter-spacing:-.05em;
  margin:0 0 12px;
  text-shadow:0 12px 24px rgba(7,14,31,.18);
}
.sub{
  margin:0;
  max-width:34ch;
  color:var(--muted);
  font-size:15px;
}
.panel{
  background:rgba(18,51,146,.34);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(8px);
  box-shadow:var(--shadow);
  padding:16px;
}
button{
  font:inherit;
  font-weight:700;
  color:var(--text);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  min-height:46px;
  padding:0 12px;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
button.sel{
  background:linear-gradient(180deg,var(--hi),var(--hi-2));
  border-color:rgba(12,23,54,.12);
  color:var(--on-hi);
  box-shadow:0 12px 20px rgba(255,191,31,.2);
}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tempo{
  display:flex;
  align-items:center;
  gap:14px;
  margin:22px 0 16px;
  font-weight:700;
  color:var(--muted);
}
.tempo input{flex:1;accent-color:var(--hi);min-height:44px}
.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin:10px 0 18px}
#play,
#reset{
  width:100%;
  min-height:58px;
  border-radius:14px;
  font-weight:900;
  letter-spacing:-.02em;
}
#play{
  background:linear-gradient(180deg,#f4f1e8 0%, #e7ddc4 100%);
  color:var(--on-hi);
  border-color:transparent;
  font-size:22px;
}
#reset{
  background:transparent;
  color:var(--text);
  border:1px solid rgba(255,255,255,.14);
}
.piano-wrap{margin:18px 0 12px}
.piano-label{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.piano{
  position:relative;
  height:180px;
  border-radius:18px;
  background:linear-gradient(180deg,#e6dcc8,#d5c9ad);
  border:1px solid rgba(30,34,52,.12);
  box-shadow:var(--card-shadow);
  overflow:hidden;
  padding:0 10px;
}
.piano-white-row{
  position:absolute;
  inset:0 0 0 0;
  display:flex;
}
.piano-key{
  position:relative;
  flex:1;
  height:100%;
  background:linear-gradient(180deg,#fff,#f3efe9);
  border:1px solid rgba(13,18,29,.24);
  border-top:0;
  border-radius:0 0 10px 10px;
  margin-right:-1px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:10px;
  color:#2d2d32;
  font-size:10px;
  font-weight:800;
  letter-spacing:.04em;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.piano-key.white{z-index:1}
.piano-key.black{
  position:absolute;
  top:0;
  width:7.2%;
  height:58%;
  background:linear-gradient(180deg,#2b344a,#101722);
  color:#f5f5f5;
  border:1px solid rgba(255,255,255,.08);
  border-radius:0 0 8px 8px;
  z-index:3;
  padding-bottom:8px;
  box-shadow:inset 0 -6px 8px rgba(255,255,255,.04);
  font-size:9px;
  letter-spacing:.03em;
}
.piano-key.active{
  background:linear-gradient(180deg,var(--hi),var(--hi-2));
  box-shadow:inset 0 0 0 2px rgba(12,23,54,.2), 0 8px 16px rgba(255,191,31,.2);
  transform:translateY(2px);
}
.piano-key.black.active{background:linear-gradient(180deg,#ffce4f,#ffb52c)}
.home{margin:20px 0 10px;font-size:14px;color:var(--muted)}
.home b{color:var(--hi)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.bar{
  background:linear-gradient(180deg,#f7f3ee,#e6e1d6);
  color:var(--on-hi);
  border-radius:14px;
  padding:8px 7px;
  min-height:88px;
  display:flex;
  flex-direction:column;
  gap:4px;
  border:1px solid rgba(12,23,54,.08);
  box-shadow:var(--card-shadow);
}
.bar.on{background:linear-gradient(180deg,var(--hi),var(--hi-2));}
.n{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.chs{display:flex;flex-direction:column;gap:4px}
.ch{
  background:transparent;
  color:inherit;
  min-height:44px;
  padding:0 4px;
  text-align:left;
  display:flex;
  flex-direction:column;
  justify-content:center;
  line-height:1.15;
  border-radius:8px;
  border-color:transparent;
}
.ch b{font-weight:900;font-size:15px;letter-spacing:-.01em}
.ch span{font-size:11px;font-weight:500;opacity:.8}
.ch.sel{background:rgba(12,23,54,.9);color:var(--panel)}
#detail{
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px 14px 14px;
  margin-top:18px;
}
h2.chord{
  font-weight:900;
  font-size:clamp(34px,10vw,56px);
  line-height:1;
  letter-spacing:-.04em;
  margin:0 0 14px;
}
.tones{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tones span{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  color:var(--text);
  padding:8px 10px;
  font-weight:900;
  font-size:18px;
  display:flex;
  flex-direction:column;
  min-width:62px;
  border-radius:10px;
}
.tones small{font-size:11px;font-weight:700;opacity:.7}
.hint{margin:0 0 10px;font-size:14px;color:var(--muted)}
.sc{
  display:block;
  width:100%;
  text-align:left;
  padding:12px 12px 10px;
  margin-bottom:8px;
  min-height:64px;
  border-radius:12px;
  background:rgba(255,255,255,.04);
  color:var(--text);
}
.sc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sc b{font-size:15px}
.sc em{font-style:normal;font-size:12px;font-weight:500;text-align:right;color:var(--muted)}
.sc .notes{display:block;margin-top:6px;color:var(--hi);font-weight:700;letter-spacing:.04em;line-height:1.35}
</style>
</head>
<body>
<main>
  <header>
    <h1>Changes</h1>
    <p class="sub">Pick a key and a style. Tap a chord to hear it and see which scales fit.</p>
  </header>
  <div class="panel">
    <div id="keys" class="g6" aria-label="Choose key"></div>
    <div id="styles" class="g2" aria-label="Choose style"></div>
    <div class="tempo"><label for="bpm">Tempo <span id="bpmv">92</span></label><input id="bpm" type="range" min="60" max="200" value="92" aria-label="Adjust tempo"></div>
    <div class="controls">
      <button id="play" type="button">Play</button>
      <button id="reset" type="button" class="ghost">Reset</button>
    </div>
  </div>
  <div class="piano-wrap">
    <p class="piano-label">Piano</p>
    <div id="piano" class="piano" aria-label="Piano keyboard"></div>
  </div>
  <p id="home" class="home"></p>
  <div id="bars" class="bars" aria-live="polite"></div>
  <section id="detail" aria-live="polite"></section>
</main>
<script>
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const KL=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const Q={
'7':{sym:'7',iv:[0,4,7,10],deg:['R','3','5','b7'],sc:[['Mixolydian',[0,2,4,5,7,9,10],'Safe and bright'],['Blues scale',[0,3,5,6,7,10],'Gritty'],['Lydian dominant',[0,2,4,6,7,9,10],'Floaty'],['Altered',[0,1,3,4,6,8,10],'Tense, wants to resolve']]},
'm7':{sym:'m7',iv:[0,3,7,10],deg:['R','b3','5','b7'],sc:[['Dorian',[0,2,3,5,7,9,10],'Smooth, the jazz default'],['Minor pentatonic',[0,3,5,7,10],'Simple and safe'],['Blues scale',[0,3,5,6,7,10],'Gritty'],['Aeolian',[0,2,3,5,7,8,10],'Darker']]},
'maj7':{sym:'maj7',iv:[0,4,7,11],deg:['R','3','5','7'],sc:[['Ionian',[0,2,4,5,7,9,11],'Plain major'],['Lydian',[0,2,4,6,7,9,11],'Dreamy'],['Major pentatonic',[0,2,4,7,9],'Simple and safe']]},
'm7b5':{sym:'m7b5',iv:[0,3,6,10],deg:['R','b3','b5','b7'],sc:[['Locrian',[0,1,3,5,6,8,10],'Standard'],['Locrian natural 2',[0,2,3,5,6,8,10],'Smoother']]}
};
const c=(o,q,r)=>({o,q,r});
const I7=c(0,'7','I7'),IV7=c(5,'7','IV7'),V7=c(7,'7','V7'),i7=c(0,'m7','im7'),iv7=c(5,'m7','ivm7'),bVI7=c(8,'7','bVI7'),
Imaj=c(0,'maj7','Imaj7'),vi7=c(9,'m7','vim7'),ii7=c(2,'m7','iim7'),IVmaj=c(5,'maj7','IVmaj7'),iio=c(2,'m7b5','iim7b5'),bVImaj=c(8,'maj7','bVImaj7');
const S={
blues:{label:'Blues',minor:false,bpm:92,home:['blues scale',[0,3,5,6,7,10]],bars:[[I7],[IV7],[I7],[I7],[IV7],[IV7],[I7],[I7],[V7],[IV7],[I7],[V7]]},
minorblues:{label:'Minor blues',minor:true,bpm:84,home:['blues scale',[0,3,5,6,7,10]],bars:[[i7],[i7],[i7],[i7],[iv7],[iv7],[i7],[i7],[bVI7],[V7],[i7],[V7]]},
jazz:{label:'Jazz',minor:false,bpm:120,home:['major scale',[0,2,4,5,7,9,11]],bars:[[Imaj],[vi7],[ii7],[V7],[Imaj],[IVmaj],[ii7,V7],[Imaj]]},
minorjazz:{label:'Minor jazz',minor:true,bpm:110,home:['natural minor',[0,2,3,5,7,8,10]],bars:[[i7],[iv7],[iio,V7],[i7],[iio],[V7],[bVImaj],[iio,V7]]}
};
let key=0,style='blues',bpm=92,sel={bar:0,ch:0},playing=false,act=-1,activeNotes=[];
const $=s=>document.querySelector(s);
const mod=n=>((n%12)+12)%12;
const FM=[5,10,3,8,1],FN=[0,2,5,7,10,3,8,1];
const nm=p=>((S[style].minor?FN:FM).includes(key)?FLAT:SHARP)[mod(p)];
const root=ch=>mod(key+ch.o);
const cname=ch=>nm(root(ch))+Q[ch.q].sym;
const cur=()=>S[style].bars[sel.bar][sel.ch];
const mtof=m=>440*2**((m-69)/12);
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const midiName=m=>NOTE_NAMES[m % 12];

function setActiveNotes(notes){
  activeNotes = [...new Set(notes.map(n => mod(n)))];
}

function resetApp(){
  key=0; style='blues'; bpm=S[style].bpm;
  sel={bar:0,ch:0}; act=-1; beat=0; next=0; q=[];
  if(playing) stop();
  $('#bpm').value=String(bpm);
  $('#bpmv').textContent=String(bpm);
  render();
}

/* audio */
let ctx,master;
function ensureCtx(){
  if(!ctx){
    const AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC();
    const comp=ctx.createDynamicsCompressor();
    master=ctx.createGain();master.gain.value=.7;
    master.connect(comp);comp.connect(ctx.destination);
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    mkVerb();loadPiano();
  }
  if(ctx.state!=='running')ctx.resume();
}
function ep(m,t,d,v){
  const f=mtof(m),o=ctx.createOscillator(),mo=ctx.createOscillator(),mg=ctx.createGain(),g=ctx.createGain();
  o.frequency.value=f;mo.frequency.value=f;
  mg.gain.setValueAtTime(f*1.1,t);mg.gain.exponentialRampToValueAtTime(f*.08,t+.6);
  mo.connect(mg);mg.connect(o.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v*.22,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d+.5);
  o.connect(g);g.connect(master);
  o.start(t);mo.start(t);o.stop(t+d+.55);mo.stop(t+d+.55);
}
function bassNote(m,t,d){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='triangle';o.frequency.value=mtof(m);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.55,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
const bs=p=>36+mod(p);
function voice(ch){
  return Q[ch.q].iv.map(i=>{let m=mod(root(ch)+i)+60;while(m>67)m-=12;return m});
}
function playChord(ch,t,d,v){voice(ch).forEach((m,i)=>pn(m,t+i*.012,d,v))}
function playScale(r,iv){
  ensureCtx();
  const base=60+r,seq=iv.map(i=>base+i).concat([base+12],iv.slice(1).reverse().map(i=>base+i));
  const t=ctx.currentTime+.05;
  seq.forEach((m,k)=>pn(m,t+k*.2,.2,.9));
}

VVVVVVVVVVVVVVVVVVVV"};
let bufs={},pianoReady=false,verb;
async function loadPiano(){
  try{
    const dec=b=>new Promise((res,rej)=>ctx.decodeAudioData(b,res,rej));
    for(const m of Object.keys(SMP)){
      const bin=atob(SMP[m]),u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      bufs[m]=await dec(u.buffer);
    }
    pianoReady=true;
  }catch(e){}
}
function mkVerb(){
  const len=Math.floor(ctx.sampleRate*1.8),ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  verb=ctx.createConvolver();verb.buffer=ir;
  const w=ctx.createGain();w.gain.value=.22;verb.connect(w);w.connect(master);
}
function pn(m,t,d,v){
  if(!pianoReady)return ep(m,t,d,v);
  t+=(Math.random()-.5)*.016;v*=.9+Math.random()*.2;
  let best=null;
  for(const k of Object.keys(bufs)){if(best===null||Math.abs(k-m)<Math.abs(best-m))best=+k}
  const s=ctx.createBufferSource(),g=ctx.createGain();
  s.buffer=bufs[best];s.playbackRate.value=Math.pow(2,(m-best)/12);
  g.gain.setValueAtTime(v*.55,t);g.gain.setValueAtTime(v*.55,t+d);g.gain.exponentialRampToValueAtTime(.0001,t+d+.35);
  s.connect(g);g.connect(master);g.connect(verb);
  s.start(t);s.stop(t+d+.4);
}

/* sequencer */
let timer,beat=0,next=0,q=[];
const chordAt=(bar,bb)=>{const b=S[style].bars[bar];return b.length===2?b[bb<2?0:1]:b[0]};
function tick(){
  const bd=60/bpm,bars=S[style].bars,nb=bars.length;
  while(next<ctx.currentTime+.15){
    const bar=Math.floor(beat/4)%nb,bb=beat%4,two=bars[bar].length===2;
    const ch=chordAt(bar,bb),r=root(ch),iv=Q[ch.q].iv;
    const nbeat=beat+1,nch=chordAt(Math.floor(nbeat/4)%nb,nbeat%4);
    const k=two?bb%2:bb,last=two?1:3;
    const bm=k===last?bs(root(nch))-1:bs(r+[0,iv[2],iv[1]][k]);
    bassNote(bm,next,bd*.9);
    if(bb===0||(two&&bb===2))playChord(ch,next,bd*1.4,.8);
    if(bb===1&&!two)playChord(ch,next+bd*.66,bd*.4,.6);
    if(bb===0)q.push({t:next,bar});
    beat++;next+=bd;
  }
}
function raf(){
  if(!playing)return;
  while(q.length&&q[0].t<=ctx.currentTime)setActive(q.shift().bar);
  requestAnimationFrame(raf);
}
function setActive(b){
  act=b;
  document.querySelectorAll('.bar').forEach((e,i)=>e.classList.toggle('on',i===b));
  const ch = b >= 0 ? chordAt(Math.floor((beat+1)/4)%S[style].bars.length, (beat+1)%4) : cur();
  if (b >= 0) setActiveNotes(voice(ch));
  renderPiano();
}
function start(){ensureCtx();beat=0;next=ctx.currentTime+.1;q=[];playing=true;timer=setInterval(tick,25);renderPiano();raf()}
function stop(){playing=false;clearInterval(timer);q=[];setActive(-1);setActiveNotes(voice(cur()));renderPiano();}

function renderPiano(){
  const activeSet = new Set(activeNotes);
  const whiteStarts = [60,62,64,65,67,69,71,72,74,76,77,79,81,83];
  const blackStarts = [61,63,66,68,70,73,75,78,80,82];
  const whiteWidth = 100 / whiteStarts.length;
  const whiteKeys = whiteStarts.map((m) => {
    const note = midiName(m);
    return `<div class="piano-key white ${activeSet.has(mod(m)) ? 'active' : ''}" data-note="${mod(m)}" title="${note}"><span>${note}</span></div>`;
  }).join('');
  const blackKeys = blackStarts.map((m) => {
    const whiteIndex = whiteStarts.findIndex(v => v > m) - 1;
    const left = (whiteIndex + 1) * whiteWidth - (whiteWidth * 0.45);
    const note = midiName(m);
    return `<div class="piano-key black ${activeSet.has(mod(m)) ? 'active' : ''}" data-note="${mod(m)}" title="${note}" style="left:${left}%"><span>${note}</span></div>`;
  }).join('');
  $('#piano').innerHTML = `<div class="piano-white-row">${whiteKeys}</div>${blackKeys}`;
}

/* ui */
function render(){
  $('#keys').innerHTML=KL.map((n,i)=>`<button type="button" class="${i===key?'sel':''}" data-k="${i}" aria-label="Select key ${n}">${n}</button>`).join('');
  $('#styles').innerHTML=Object.entries(S).map(([id,s])=>`<button type="button" class="${id===style?'sel':''}" data-s="${id}" aria-label="Select style ${s.label}">${s.label}</button>`).join('');
  $('#play').textContent=playing?'Stop':'Play';
  $('#play').setAttribute('aria-label', playing ? 'Stop playback' : 'Play progression');
  const h=S[style].home;
  $('#home').innerHTML=`Home scale for the whole tune: <b>${nm(key)} ${h[0]}</b> (${h[1].map(i=>nm(key+i)).join(' ')})`;
  $('#bars').innerHTML=S[style].bars.map((bar,bi)=>`<div class="bar${act===bi?' on':''}"><span class="n">${bi+1}</span><div class="chs">${bar.map((ch,ci)=>`<button type="button" class="ch${sel.bar===bi&&sel.ch===ci?' sel':''}" data-b="${bi}" data-c="${ci}" aria-label="Choose chord ${cname(ch)}"><b>${cname(ch)}</b><span>${ch.r}</span></button>`).join('')}</div></div>`).join('');
  const ch=cur(),r=root(ch),qd=Q[ch.q];
  setActiveNotes(voice(ch));
  $('#detail').innerHTML=`<h2 class="chord">${cname(ch)}</h2>
<div class="tones">${qd.iv.map((i,x)=>`<span><small>${qd.deg[x]}</small>${nm(r+i)}</span>`).join('')}</div>
<p class="hint">Scales that fit. Tap one to hear it.</p>
${qd.sc.map((s,x)=>`<button type="button" class="sc" data-x="${x}" aria-label="Hear ${nm(r)} ${s[0]}"><span class="top"><b>${nm(r)} ${s[0]}</b><em>${s[2]}</em></span><span class="notes">${s[1].map(i=>nm(r+i)).join(' ')}</span></button>`).join('')}`;
  renderPiano();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  ensureCtx();
  const d=b.dataset;
  if(d.k!==undefined){key=+d.k;render();}
  else if(d.s){style=d.s;bpm=S[style].bpm;$('#bpm').value=bpm;$('#bpmv').textContent=bpm;sel={bar:0,ch:0};beat=0;q=[];act=-1;render();}
  else if(d.b!==undefined){sel={bar:+d.b,ch:+d.c};if(!playing)playChord(cur(),ctx.currentTime+.02,1.2,.9);render();}
  else if(d.x!==undefined){const ch=cur();playScale(root(ch),Q[ch.q].sc[+d.x][1])}
  else if(b.id==='play'){playing?stop():start();render();}
  else if(b.id==='reset'){resetApp();}
});
$('#bpm').addEventListener('input',e=>{bpm=+e.target.value;$('#bpmv').textContent=bpm});
render();
</script>
